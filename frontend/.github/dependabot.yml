# GitHub Dependabot Configuration - Automated Vulnerability & Dependency Scanning
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    labels:
      - "security"
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "security"
      include: "scope"
    target-branch: "main"
